# Deploy athan-dial.github.io to GitHub Pages from the `main` source branch.
#
# ARTIFACT STRATEGY — read before changing anything here.
#
# hugo.toml sets publishDir = "docs", and docs/ contains two static trees that Hugo does NOT
# generate:
#   * docs/agency/**  — 127 tracked files, NO SOURCE ANYWHERE. Irreplaceable.
#   * docs/skills/**  — regenerated by scripts/fetch-skills.sh from athan-dial/skills releases.
#
# Hugo does not prune unknown files from publishDir, so building INTO docs/ leaves both trees
# in place and yields a complete site. That is why this workflow builds into docs/ and uploads
# docs/ as the Pages artifact, rather than building into a clean directory. Building into a
# fresh dir would silently drop /agency/ from the published site.
#
# The artifact is uploaded, never committed. Under the old gh-pages model every content change
# committed a regenerated docs/ tree; that is what this replaces.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Do not cancel an in-flight deploy — a half-finished
# Pages deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Hugo .GitInfo / .Lastmod need full history

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.3"
          extended: true

      - name: Fetch plugin subsites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-skills.sh

      - name: Build site into docs/ (preserves docs/agency and docs/skills)
        run: hugo --gc --minify

      - name: Verify build and static trees
        run: bash scripts/verify-build.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

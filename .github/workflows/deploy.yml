# Deploy athan-dial.github.io to GitHub Pages from the `main` source branch.
#
# ARTIFACT STRATEGY — read before changing anything here.
#
# hugo.toml sets publishDir = "docs". docs/ used to contain two static trees that Hugo does
# NOT generate. Both are now retired, so every file under docs/ is Hugo output again:
#
#   * docs/agency/**  — RETIRED 2026-08-12 by owner decision (127 tracked files, no source).
#   * docs/skills/**  — plugin subsites fetched by scripts/fetch-skills.sh from the
#     athan-dial/skills releases. RETIRED 2026-08-14: the dev plugin moved into the private
#     claude-skills repo as user-level dev:* skills, and athan-dial/skills was deleted, so
#     there is nothing left to fetch. The fetch step and that script are gone with it.
#     /skills/case-studies/ survives — it is ordinary Hugo output from content/skills/.
#
# verify-build.sh asserts both stay gone, and data/redirects.toml generates meta-refresh
# stubs so the old /agency/* and /skills/* inbound links resolve instead of 404ing.
#
# Hugo does not prune unknown files from publishDir. That mattered while the static trees
# existed — building into a fresh dir would have silently dropped them from the published
# site. It no longer does, but this workflow still builds into docs/ and uploads docs/ as the
# Pages artifact, because the redirect stubs for both retired trees live there.
#
# The artifact is uploaded, never committed. Under the old gh-pages model every content change
# committed a regenerated docs/ tree; that is what this replaces.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Do not cancel an in-flight deploy — a half-finished
# Pages deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Hugo .GitInfo / .Lastmod need full history

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.3"
          extended: true

      - name: Build site into docs/ (retired trees survive as redirect stubs only)
        run: hugo --gc --minify

      - name: Verify build and static trees
        run: bash scripts/verify-build.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

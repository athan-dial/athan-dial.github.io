# Deploy athan-dial.github.io to GitHub Pages from the `main` source branch.
#
# ARTIFACT STRATEGY — read before changing anything here.
#
# hugo.toml sets publishDir = "public", and public/ is gitignored. Every file the deploy
# uploads is Hugo output, built fresh in this job. Nothing under the publish dir is committed.
#
# It used to be publishDir = "docs", committed, and built INTO — because docs/ held two trees
# Hugo does not generate and does not prune:
#   * docs/agency/**  — RETIRED 2026-08-12 (127 files, no source anywhere).
#   * docs/skills/**  — plugin subsites fetched by scripts/fetch-skills.sh from the
#     athan-dial/skills releases. RETIRED 2026-08-14: the dev plugin moved into the private
#     claude-skills repo as user-level dev:* skills and that repo was deleted, so the fetch
#     step could only fail. The script is gone with it.
#
# Both are now redirect stubs generated from data/redirects.toml, so old inbound links still
# resolve. scripts/verify-build.sh asserts they stay stubs, and that docs/ never becomes a
# tracked tree again — committing build output is how three superseded CSS fingerprints and an
# RSS feed with http://localhost:1313 in it ended up served on the public site.
#
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Do not cancel an in-flight deploy — a half-finished
# Pages deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Hugo .GitInfo / .Lastmod need full history

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.3"
          extended: true

      - name: Build site
        run: hugo --gc --minify

      - name: Verify build and static trees
        run: bash scripts/verify-build.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

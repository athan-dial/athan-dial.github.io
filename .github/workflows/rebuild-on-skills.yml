# Triggered when athan-dial/skills publishes new plugin-site releases.
#
# UNDER THE OLD MODEL this workflow rebuilt the site and committed the regenerated docs/ tree
# back to gh-pages. Under the main + Actions model there is no committed output: this workflow
# simply re-runs the deploy pipeline against main, which fetches the fresh plugin subsites as
# part of its own build.
#
# Kept as a separate workflow (rather than adding repository_dispatch to deploy.yml) so the
# skills-update trigger stays visible and independently runnable in the Actions tab.

name: Rebuild on skills update

on:
  repository_dispatch:
    types: [skills-updated]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger the Pages deploy workflow against main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Skills update received — dispatching Deploy to Pages on main."
          gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Report
        run: |
          echo "Deploy dispatched. Watch it at:"
          echo "  https://github.com/$GITHUB_REPOSITORY/actions/workflows/deploy.yml"

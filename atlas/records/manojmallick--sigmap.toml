title = "SigMap: a repeatable code map that checks AI answers"
repository_owner = "manojmallick"
repository_name = "sigmap"
date_observed = "date_not_recovered"
topic = "agent-tooling"
mechanism = "Scans a codebase without calling any AI model and writes a list of its files and function signatures. Agents use it as context, and it flags files or functions an AI answer invented."
license_spdx = "MIT"
evidence_state = "inspected"
status = "candidate"
editorial_review = "pending"
last_review_date = "2026-11-06"
unavailable = ["tested", "adopted", "independent performance claims"]

[opinion]
value_judgment = "The strongest idea here is the check, not the map: comparing an AI answer against the real repo catches invented file names and calls cheaply. But the check covers only names it can look up. I would revise this if it misses most real errors, which I did not test."
fit = "Use it when you want the same context file every run and a quick check that an AI answer names real files and functions. Skip it if you need to confirm that library APIs or methods exist, which the README says it cannot do."
limitations = ["I read the README but did not run it or open the linked limitations file, so I do not know how often its checks miss errors.", "Its retrieval and size figures are the project's own and I did not reproduce them."]


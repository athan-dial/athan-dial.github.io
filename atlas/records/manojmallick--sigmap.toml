[[facts]]
claim = "It makes no model calls and no embeddings; the same repo is meant to give the same map every time."
source_url = "https://github.com/manojmallick/sigmap#readme"

[[facts]]
claim = "The sigmap verify command checks an AI answer for invented files, imports, functions and npm scripts, and prints what it did not check."
source_url = "https://github.com/manojmallick/sigmap#readme"

[[facts]]
claim = "It cannot confirm that a method, option or library API exists, according to the project."
source_url = "https://github.com/manojmallick/sigmap#readme"

[[facts]]
claim = "It can run as an MCP server and write context files for several assistants, including Claude, Cursor and Copilot."
source_url = "https://github.com/manojmallick/sigmap#readme"


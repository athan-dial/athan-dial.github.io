unavailable = ["tested", "adopted", "independent performance claims"]

[opinion]
value_judgment = "It leaves planning and merging to you and only connects sessions you already run, which keeps its job small. I would revise this if asks between agents get lost or stall in practice, which I did not test."
fit = "Use it when agents in separate repos need to ask each other concrete questions, or you want to nudge them from your phone. Skip it if you want a tool that splits goals into tasks and merges the results."
limitations = ["I only read the README. I did not run the daemon or connect any agents.", "The README lists several change-prone parts as experimental or in transition, and I did not check which ones are stable."]


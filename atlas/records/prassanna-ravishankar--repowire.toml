[[facts]]
claim = "Agent commits made through it carry Git trailers, and the repowire why command replays the conversations behind a commit."
source_url = "https://github.com/prassanna-ravishankar/repowire#readme"

[[facts]]
claim = "An optional hosted relay gives remote dashboard access, but the README says agents on different machines do not message each other."

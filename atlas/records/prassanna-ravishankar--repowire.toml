topic = "agent-orchestration"
mechanism = "A local background service that lets coding agents already open in different repos find each other and pass questions and replies. You can also reach them from a browser dashboard, Telegram or Slack."
license_spdx = "none"
license_note = "GitHub reports no license and the repository has no LICENSE file in its top folder, but the README ends with a License section that says MIT."

[opinion]
value_judgment = "A vendor shipping its own skills is a good sign that the instructions track its real services. I would revise this if the skills lag product changes, which I did not check."
fit = "Use it when you build on Google Cloud and want an agent to follow current, vendor-written steps. Skip it if you do not use Google products."
limitations = ["I read the README and its skill list only, not any skill file, so I do not know how deep or accurate they are.", "The README lists many Google Cloud and GKE skills; I did not check which ones are still in preview."]

[[facts]]
claim = "Skills install with the command npx skills add google/skills, which asks which skills, agents and scope to use."
source_url = "https://github.com/google/skills#readme"


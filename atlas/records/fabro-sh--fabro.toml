[[facts]]
claim = "Workflows are defined in Graphviz DOT files with branching, loops, parallel steps and human approval gates."
source_url = "https://github.com/fabro-sh/fabro#readme"

[[facts]]
claim = "A CSS-like stylesheet routes each step to a chosen model and provider, with fallback chains."
source_url = "https://github.com/fabro-sh/fabro#readme"

[[facts]]
claim = "Every stage commits code changes and run metadata to Git branches, so runs can be resumed or reverted."
source_url = "https://github.com/fabro-sh/fabro#readme"

[[facts]]
claim = "Agents can run in isolated Daytona cloud sandboxes, and Fabro itself is a single Rust binary."
source_url = "https://github.com/fabro-sh/fabro#readme"


[[facts]]
claim = "Installs are recorded in a skills.lock file with SHA-512 hashes, and versions follow semver."
source_url = "https://github.com/tankpkg/tank#readme"

[[facts]]
claim = "A skills.json file sets a permission budget for network, filesystem and subprocess access, and Tank asks for approval when a skill exceeds it."
source_url = "https://github.com/tankpkg/tank#readme"

[[facts]]
claim = "Each published skill goes through a six-stage security analysis and gets a 0 to 10 audit score."
source_url = "https://github.com/tankpkg/tank#readme"


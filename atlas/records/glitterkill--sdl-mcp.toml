[[facts]]
claim = "It indexes a repository into a graph of symbols (named code units) and their relationships, using tree-sitter for structure."
source_url = "https://github.com/GlitterKill/sdl-mcp#readme"

[[facts]]
claim = "Agents escalate in steps from compact symbol cards to skeletons and hot paths, then to policy-gated source windows."
source_url = "https://github.com/GlitterKill/sdl-mcp#readme"

[[facts]]
claim = "It runs locally and speaks the Model Context Protocol over stdio or HTTP."
source_url = "https://github.com/GlitterKill/sdl-mcp#readme"

[[facts]]

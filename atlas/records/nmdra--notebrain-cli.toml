[opinion]
value_judgment = "I read this as read-only memory for a coding agent: it retrieves from notes you wrote and does not record what the agent learns. The README says the embedding model runs offline, which keeps the notes local. I would revise this if the hidden-connection results are mostly noise on a large vault, which I did not test."
fit = "Use it when your notes live in Obsidian and you want a coding agent to search them without a cloud service. Skip it if you run macOS or Windows and do not want to build it yourself; the author tests Linux only."
limitations = ["I did not run it or check search quality, including the hidden-connection feature.", "I read only the main README, not the linked wiki pages on architecture and ranking."]


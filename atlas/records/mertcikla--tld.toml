[opinion]
value_judgment = "I read this as diagrams treated like code, which suits agents that need to keep architecture maps current. It also ships a web app, a desktop app and a hosted version, so the surface is wide. I would revise this if agent-built diagrams stay accurate after a few commits, which I did not test."
fit = "Use it when you want agents or CI to create and update architecture diagrams stored beside code. Skip it if you want a single-file diagram format; it runs a server backed by SQLite or PostgreSQL."
limitations = ["I did not run it or try the install script, which downloads from the project's own site.", "I did not open the linked example diagrams or the agent skill file."]


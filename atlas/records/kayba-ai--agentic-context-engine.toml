[[facts]]
claim = "It keeps a Skillbook, a stored collection of strategies that changes as tasks run."
source_url = "https://github.com/kayba-ai/agentic-context-engine#readme"

[[facts]]
claim = "Three roles share the loop: an agent that does the task, a reflector that reads the trace (a log of what the agent did), and a manager that adds, refines and removes strategies."
source_url = "https://github.com/kayba-ai/agentic-context-engine#readme"

[[facts]]
claim = "The reflector writes and runs Python code in a sandbox to search a trace for patterns."
source_url = "https://github.com/kayba-ai/agentic-context-engine#readme"

[[facts]]
claim = "The project says it needs no fine-tuning, training data or vector database."
source_url = "https://github.com/kayba-ai/agentic-context-engine#readme"


title = "AgentField: a control plane that runs agents as services"
repository_owner = "agent-field"
repository_name = "agentfield"
date_observed = "date_not_recovered"
topic = "agent-orchestration"
mechanism = "Turns agent functions written in Python, Go or TypeScript into web endpoints. A central server routes calls between agents, retries failures, and traces each request for teams running many agents."
license_spdx = "Apache-2.0"
evidence_state = "inspected"
status = "candidate"

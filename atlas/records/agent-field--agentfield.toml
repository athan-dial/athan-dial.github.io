[[facts]]
claim = "The control plane is a Go service that handles queues, retries and tracing, and can pause a run for human approval."
source_url = "https://github.com/Agent-Field/agentfield#readme"

[[facts]]
claim = "The project says each cross-agent hop adds roughly 100 to 200 milliseconds of routing overhead."
source_url = "https://github.com/Agent-Field/agentfield#readme"

[[facts]]

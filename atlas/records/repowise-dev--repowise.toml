[[facts]]
claim = "Graph, risk, health, tests and dead code checks make no calls to a language model, and indexing needs no API key."
source_url = "https://github.com/repowise-dev/repowise#readme"

[[facts]]
claim = "It builds a call graph (a map of what calls what) across 28 languages and generates a wiki page for each module and file."
source_url = "https://github.com/repowise-dev/repowise#readme"

[[facts]]
claim = "It exposes ten task-shaped tools to agents such as Claude Code, Codex and Cursor over the Model Context Protocol (MCP)."
source_url = "https://github.com/repowise-dev/repowise#readme"

[[facts]]
claim = "A separate hosted service sends your code to the vendor's platform; the open-source version reads code on your machine."
source_url = "https://github.com/repowise-dev/repowise#readme"

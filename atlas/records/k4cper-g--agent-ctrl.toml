[[facts]]
claim = "Windows uses UI Automation and macOS uses its Accessibility interface, both with the full set of actions; Linux supports snapshot, find and window listing only."
source_url = "https://github.com/k4cper-g/agent-ctrl#readme"

[[facts]]
claim = "A snapshot lists elements with references like @e4, and a reference is valid only for the snapshot that produced it."
source_url = "https://github.com/k4cper-g/agent-ctrl#readme"

[[facts]]
claim = "A long-running background process per session handles requests, and a TypeScript client is available."
source_url = "https://github.com/k4cper-g/agent-ctrl#readme"

[[facts]]
claim = "Windows and macOS builds are installed through npm or release binaries; Linux has no prebuilt release."
source_url = "https://github.com/k4cper-g/agent-ctrl#readme"


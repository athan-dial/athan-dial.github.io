repository_name = "agent-ctrl"
date_observed = "date_not_recovered"
topic = "computer-use-agents"
mechanism = "Lets an AI agent operate native desktop apps from a command line. It lists the on-screen elements once, then clicks, types or presses keys on them by reference. Browsers are out of scope."
license_spdx = "Apache-2.0"
evidence_state = "inspected"
status = "candidate"
editorial_review = "pending"
last_review_date = "2026-11-06"
unavailable = ["tested", "adopted", "independent performance claims"]

[opinion]
value_judgment = "I read this as a way to give an agent a stable handle on desktop controls: look once, then act on named references. I would revise this if the references prove brittle on apps whose element list fills in late, which the README flags for Chromium-based apps and I did not test."
fit = "Use it when an agent has to operate a native Windows or macOS app that has no API. Skip it if you need actions on Linux, where only reading is supported, or if you need browser automation, which it leaves out."
limitations = ["I did not run it on any operating system or check the macOS permission setup. I read the install, commands, platform and known-limitations sections, not the linked docs or example scripts."]


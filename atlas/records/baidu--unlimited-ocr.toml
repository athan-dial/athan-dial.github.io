[opinion]
value_judgment = "I read this as a heavy, GPU-bound reader for very long documents, not a light parser. The \"unlimited\" label and the benchmark leadership are the project's own claims, and I would revise this if output quality drops on documents far longer than its benchmarks cover, which I did not check."
fit = "Use it when you have a GPU and want a long scanned document turned into text in a single request. Skip it if you need a small tool that runs on a laptop or a CPU."
limitations = ["I did not run it or check its benchmark results, and I did not read the two papers the README links.", "I did not check whether it runs on a smaller GPU than the NVIDIA A800 the README names."]


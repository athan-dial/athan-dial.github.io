[[facts]]
claim = "Input is page images in page order, or a PDF converted to images first; the output has one page marker per input page, in the same order."
source_url = "https://github.com/baidu/Unlimited-OCR#readme"

[[facts]]
claim = "The project says a fixed-size set of working references, for example 512, keeps per-step time and memory nearly flat however long the document is."
source_url = "https://github.com/baidu/Unlimited-OCR#readme"

[[facts]]
claim = "The README's tested setup is Python 3.10 on one NVIDIA A800 80 GB GPU, and it recommends serving the model with SGLang."
source_url = "https://github.com/baidu/Unlimited-OCR#readme"

[[facts]]
claim = "The repo includes a batch client for the MPDocBench and MarathonDocBench benchmarks, and the model weights are on Hugging Face."

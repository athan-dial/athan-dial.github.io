[[facts]]
claim = "Input can be PDF, DOCX, XLSX, PPTX or images; output can be Markdown, JSON with bounding boxes, plain text or page screenshots."
source_url = "https://github.com/run-llama/liteparse#readme"

[[facts]]
claim = "Text comes from PDFium; the built-in OCR (text recognition from images) is Tesseract, and any HTTP OCR server such as EasyOCR or PaddleOCR can be plugged in."
source_url = "https://github.com/run-llama/liteparse#readme"

[[facts]]
claim = "A complexity check reports whether a document needs OCR or heavier parsing before you run a full parse."
source_url = "https://github.com/run-llama/liteparse#readme"

[[facts]]
claim = "It runs from Rust, Node.js, Python or the browser (WebAssembly), with no ML model and no cloud dependency."
source_url = "https://github.com/run-llama/liteparse#readme"

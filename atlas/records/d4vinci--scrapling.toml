value_judgment = "Scraping libraries are common. The part I find interesting is that this one ships for agents too, as an MCP server and an agent skill. I would look at that packaging as a pattern. I would revise this if the agent interface turns out to be a thin wrapper, which I did not check."
fit = "Use it when you want one library for scraping and for handing scraping to an agent. Skip it if you only need to fetch a few pages; the README describes a larger toolset."
limitations = ["I did not test its anti-bot claims. Scraping sites that block bots can break their terms of use."]


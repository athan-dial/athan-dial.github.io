[[facts]]
claim = "It serves requests from many agents together on the Mac's GPU and works with OpenCode, Cline, Aider, OpenHands, Claude Code and apps that speak the OpenAI, Anthropic or Ollama formats."
source_url = "https://github.com/Generated-Computers/Locals#readme"

[[facts]]
claim = "Replies are written under a grammar so tool calls always parse and only use the tools an agent offered."
source_url = "https://github.com/Generated-Computers/Locals#readme"

[[facts]]
claim = "The `locals run` command splits a task into parts, gives each part to several agents in their own copy of the project, and lets your tests decide."
source_url = "https://github.com/Generated-Computers/Locals#readme"

[[facts]]
claim = "The project says it is up to 3x faster than mlx-lm with eight requests at once."
source_url = "https://github.com/Generated-Computers/Locals#readme"

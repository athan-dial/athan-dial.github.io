[opinion]
value_judgment = "It is a heavy system, and the draw is that hooks enforce checks outside the model's prompt. I would revise my read if running its full install costs more context and setup than it saves, which I did not test."
fit = "Use it when you want enforced workflows, such as test-first gates and a separate reviewer, across more than one agent tool. Skip it if you want a few light skills, since the README itself warns to install rules selectively."
limitations = ["I read only part of this very long README, and none of the code or skill files.", "The counts of agents, skills and commands are the project's own, and I did not check them or the optional paid tier it mentions."]

[[facts]]
claim = "The project says it ships 71 subagents, 314 skills and 98 slash commands."
source_url = "https://github.com/affaan-m/ECC#readme"

[[facts]]
claim = "Hooks run on tool events outside the model's context, and rules are always-loaded standards."
source_url = "https://github.com/affaan-m/ECC#readme"

[[facts]]
claim = "The install is described as one plugin, ecc@ecc, with adapters for Codex, OpenCode, Cursor and other tools."

topic = "agent-memory"
mechanism = "Keeps tickets, decisions, lessons and session handovers as files in a .story folder, so a coding agent can pick up where the last session stopped. Works with Claude Code and Codex."
license_spdx = "NOASSERTION"
license_note = "The README and the LICENSE file state PolyForm Shield 1.0.0, a source-available license that is not OSI open source; it bars using the software to build a competing product."

[[facts]]
claim = "It manages both a knowledge graph (a web of linked facts) and vector embeddings, and its dual-level retrieval covers detailed facts and abstract concepts."
source_url = "https://github.com/HKUDS/LightRAG#readme"

[[facts]]
claim = "Deleting a document triggers a rebuild of the affected entities and relationships using the cached model output."
source_url = "https://github.com/HKUDS/LightRAG#readme"

[[facts]]
claim = "The default storage is in memory with local file persistence, and the README says it is only for small-scale testing, not production."
source_url = "https://github.com/HKUDS/LightRAG#readme"

[[facts]]
claim = "It offers four text chunking strategies and PostgreSQL is the production backend the README recommends."
source_url = "https://github.com/HKUDS/LightRAG#readme"


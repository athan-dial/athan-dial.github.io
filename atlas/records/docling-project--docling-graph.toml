[opinion]
value_judgment = "I like that the schema comes first: you define what a valid entity looks like, and extraction has to fit it. That suits fields where exact links between things matter. I would revise this if the checked output still needs heavy manual cleanup on real documents, which I did not test."
fit = "Use it when you need exact entity links from documents and can write a schema up front. Skip it if approximate search over text is enough for your questions."
limitations = ["I did not run it or check extraction accuracy on any document.", "I read the capabilities and quick start but not the linked docs site."]


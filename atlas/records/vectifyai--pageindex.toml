topic = "retrieval-knowledge-graphs"
mechanism = "Builds a table-of-contents-style tree of a long document, then has a language model read down the tree to find the right section. It uses no vector database and no chunking."
license_spdx = "MIT"
evidence_state = "inspected"
status = "candidate"
editorial_review = "pending"
last_review_date = "2026-11-06"
unavailable = ["tested", "adopted", "independent performance claims"]

[opinion]
value_judgment = "I read it as a bet that for long, structured documents, a model reasoning over an outline finds relevant passages better than similarity search does. The search step depends on a strong model at query time, so cost and speed shift there. I would revise this if it holds up against vector search on my own documents, which I did not check."
fit = "Use it when your documents are long and well structured, such as reports and filings. Skip it if you search many short, loosely structured texts, where an outline gives the model little to follow."
limitations = ["I did not run it, and the benchmark and cost figures in the README are the project's own, so I did not check them.", "I read the introduction, quickstart and the start of the benchmarks but not the rest."]


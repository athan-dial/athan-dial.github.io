[[facts]]
claim = "It uses Dolt, a version-controlled SQL database, and syncs between machines with Dolt push and pull."
source_url = "https://github.com/gastownhall/beads#readme"

[[facts]]
claim = "Task IDs are hashes, which the README says prevents merge collisions across agents and branches."
source_url = "https://github.com/gastownhall/beads#readme"

[[facts]]
claim = "The ready command lists tasks with no open blockers, and the claim option takes a task atomically."
source_url = "https://github.com/gastownhall/beads#readme"

[[facts]]
claim = "The remember command stores a note that the prime command injects into later sessions."
source_url = "https://github.com/gastownhall/beads#readme"

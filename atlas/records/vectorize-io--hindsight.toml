[[facts]]
claim = "Memories live in banks, each an isolated store for one user, agent or project."
source_url = "https://github.com/vectorize-io/hindsight#readme"

[[facts]]
claim = "Recall runs meaning, keyword, entity-link and time-range searches in parallel, then merges and reranks the results."
source_url = "https://github.com/vectorize-io/hindsight#readme"

[[facts]]
claim = "Related facts are consolidated into observations, which are refined rather than overwritten when new evidence arrives."
source_url = "https://github.com/vectorize-io/hindsight#readme"

[[facts]]

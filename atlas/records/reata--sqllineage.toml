[opinion]
value_judgment = "Parsing the SQL answers which tables a statement touches without running anything. I would pair it with runtime lineage instead of choosing between them. That pairing is weaker if its SQL dialect or column-level coverage is thin, which I did not check."
fit = "Use it when you have SQL text and want table-level lineage without running it. Skip it if you need to see what actually ran; use runtime lineage such as OpenLineage."
limitations = ["I did not check which SQL dialects it supports or how well it handles columns."]


date_observed = "date_not_recovered"
topic = "agent-memory"
mechanism = "Runs agent memory code against public memory benchmarks and records accuracy, cost and speed for each run. It is a measuring tool for the AgentOS memory code, not a memory system."
license_spdx = "Apache-2.0"
evidence_state = "inspected"
status = "candidate"
editorial_review = "pending"

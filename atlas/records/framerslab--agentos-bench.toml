unavailable = ["tested", "adopted", "independent performance claims"]

[opinion]
value_judgment = "This is a benchmark harness, so I read it as a way to check memory claims, not as a memory product. Its habit of listing failed experiments next to the headline numbers is the part I trust most. I would revise this if the runs reproduce without the author's setup, which I did not try."
fit = "Look at it when you want to see how memory claims are measured on LongMemEval and LOCOMO. Skip it if you want a memory store to build on; the memory code lives in a separate package."
limitations = ["I did not run it. Every accuracy and cost figure in the README is the author's own, and I did not verify them or the comparisons to other vendors.", "Several vendor reproduction adapters are marked as queued, and I did not check how much of the harness is finished."]


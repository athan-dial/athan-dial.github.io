[opinion]
value_judgment = "Each task gets its own copy of the code (a git workspace), so agents cannot overwrite each other. CAO describes isolated terminal sessions, a related idea. I would drop it as a model if side-by-side agents need to coordinate, which the README does not describe."
fit = "Use it to run several coding agents side by side without them colliding. Skip it if you want agents that coordinate with each other; the README describes separation, not coordination."
limitations = ["I only read the README, so I cannot say how well the isolation works in practice."]


title = "LM Wiki: an Obsidian plugin that answers from your notes"
repository_owner = "domleca"
repository_name = "llm-wiki"
date_observed = "date_not_recovered"
topic = "agent-memory"
mechanism = "Reads each note in an Obsidian vault with a language model, builds a store of people, ideas and links between them, and answers questions with links back to the source notes."
license_spdx = "MIT"
evidence_state = "inspected"
status = "candidate"
editorial_review = "pending"
last_review_date = "2026-11-06"
unavailable = ["tested", "adopted", "independent performance claims"]

[opinion]
value_judgment = "I read this as search over a pre-built index of your notes, not as memory that an agent writes to. The extraction pass is the cost: the README says about four hours for a 600-note vault on a laptop. I would revise this if the extracted people and ideas answer questions better than plain search over the notes, which I did not check."
fit = "Use it when you keep notes in Obsidian and want private question answering with a local model. Skip it if you need a store that an agent adds new memories to during a session."
limitations = ["I did not run it or check answer quality, and the README gives no accuracy measures.", "I did not check how it behaves on notes that change often beyond the README's description of re-extracting a note when it is saved."]


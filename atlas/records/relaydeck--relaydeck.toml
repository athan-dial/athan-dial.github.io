claim = "It wraps vendor agent command-line tools such as Claude Code, Codex, Cursor and OpenCode and runs them unattended in terminals."
source_url = "https://github.com/relaydeck/relaydeck#readme"

[[facts]]
claim = "Messages between agents are stored in a local SQLite database, delivered to a live agent immediately and to a stopped one when it starts."
source_url = "https://github.com/relaydeck/relaydeck#readme"

[[facts]]

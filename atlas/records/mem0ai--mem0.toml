[[facts]]
claim = "Extraction is a single pass: one call to a language model, adding memories and never updating or deleting them, so memories accumulate."
source_url = "https://github.com/mem0ai/mem0#readme"

[[facts]]
claim = "Entities (named things) are extracted, embedded and linked across memories to improve retrieval."
source_url = "https://github.com/mem0ai/mem0#readme"

[[facts]]
claim = "Retrieval scores meaning, keyword (BM25) and entity matches in parallel and merges them."
source_url = "https://github.com/mem0ai/mem0#readme"


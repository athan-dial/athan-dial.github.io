# Redirect map for retired routes (Editorial Systems redesign).
# Rendered as meta-refresh + canonical stubs via layouts/_default/redirect.html
# and content/_content.gotmpl. Do not add entries under docs/agency/ except the
# agency index and the six migrated dispatch slugs — playbooks and other deep
# links must keep serving the committed static tree.
#
# `path` is the content-adapter identity (under redirects/ so we never create a
# real content/agency section that would emit index.xml over the static tree).
# `from` is the public URL.

[[redirects]]
  from = "/case-studies/"
  to = "/work/"
  permanent = true
  path = "redirects/case-studies"


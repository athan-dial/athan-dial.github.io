# Redirect map for retired routes (Editorial Systems redesign).
# Rendered as meta-refresh + canonical stubs via layouts/_default/redirect.html
# and content/_content.gotmpl.
#
# The docs/agency/** static tree this used to sit alongside (127 files) was fully
# retired in d8e83376 (2026-08-12) — there is no "committed static tree" left to
# defer to, and publishDir itself moved docs/ -> public/ on 2026-08-14. Only the
# agency index, the agency dispatches/playbooks index pages, and the seven
# migrated dispatch slugs got stubs here; individual playbook slugs (e.g.
# build-your-first-skill) were deliberately not migrated — see
# content/_content.gotmpl:13 ("playbooks and other Agency deep links are not
# generated"). Do not add a stub for a playbook slug without a real reason;
# their absence is the retirement decision working as intended, not a gap.
#
# `path` is the content-adapter identity (under redirects/ so we never create a
# real content/agency section that would emit index.xml over the retired tree).
# `from` is the public URL.

[[redirects]]
  from = "/case-studies/"
  to = "/work/"
  permanent = true
  path = "redirects/case-studies"

[[redirects]]
  from = "/case-studies/learning-agenda-framework-montai/"
  to = "/work/"
  permanent = true
  path = "redirects/case-studies-learning-agenda-framework-montai"

[[redirects]]
  from = "/case-studies/preventing-metric-theater-drug-discovery-ml/"
  to = "/work/"
  permanent = true
  path = "redirects/case-studies-preventing-metric-theater-drug-discovery-ml"

[[redirects]]
  from = "/case-studies/reducing-pipeline-latency-decision-velocity/"
  to = "/work/"
  permanent = true
  path = "redirects/case-studies-reducing-pipeline-latency-decision-velocity"

[[redirects]]
  from = "/case-studies/scaling-ai-nominations-montai/"
  to = "/work/"
  permanent = true
  path = "redirects/case-studies-scaling-ai-nominations-montai"

[[redirects]]
  from = "/case-studies/shiny-framework-standardization-montai/"
  to = "/work/"
  permanent = true
  path = "redirects/case-studies-shiny-framework-standardization-montai"

# Two further /case-studies/ stubs were DELETED here on 2026-08-14, and are not to be
# reinstated. Each slug concatenated an internal identifier with the employer name, and
# was generated into every build. Under CONTENT-SAFETY-CONTRACT.md the disclosure IS the
# association with the employer, so the slug itself was the disclosure — a redirect stub
# is not a special case. They had been exempted by the private allowlist on the grounds
# that a live URL cannot be changed without breaking an inbound link; that reasoning was
# overturned because the entries protected a stub, not an article. The articles are
# already retired, so the stubs carried nothing a reader loses. Both URLs now 404 —
# accepted deliberately. Do not re-add them, and do not re-add an allowlist exemption
# for them; the fix is the deletion, not the exemption.

[[redirects]]
  from = "/agency/"
  to = "/thinking/"
  permanent = true
  path = "redirects/agency"








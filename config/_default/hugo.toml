# -- Site Configuration --
# Hugo Resume Theme Configuration

# CRITICAL: Do not change baseURL (GitHub Pages deployment).
# publishDir moved docs -> public on 2026-08-14. It was "docs" so that building INTO the
# committed publish dir preserved two static trees Hugo does not generate (docs/agency/**
# and the fetched docs/skills/** plugin subsites). Both are retired, so nothing needs
# preserving and the build output is no longer committed at all.
baseURL = "https://athan-dial.github.io/"
languageCode = "en-us"
defaultContentLanguage = "en"
publishDir = "public"

title = "Athan Dial"
enableRobotsTXT = true

# Hugo Resume Theme settings
PygmentsCodeFences = true
PygmentsCodeFencesGuessSyntax = true
PygmentsStyle = "monokai"

# Content gate (Editorial Systems / REDESIGN-PLAN):
# Hugo has no native frontmatter-predicate exclusion for status/visibility.
# Mechanism chosen: buildDrafts = false + draft: true convention.
# Archetypes and section cascade (_target kind: page) default to status: draft,
# visibility: private, and draft: true. Publishable pages must set
# status: published, visibility: public, AND draft: false. Anything with
# status: draft or visibility: private must keep draft: true — then it produces
# no output page and no sitemap entry. See .planning/CONTENT-MODEL.md.
buildDrafts = false

# tag/category taxonomies removed 2026-08-14: zero terms, zero inbound links, generated two
# empty public pages (/categories/, /tags/) already excluded from sitemap.xml. `themes` stays —
# 5 content files carry a themes: front-matter key with 10 real inbound hrefs.
[taxonomies]
  theme = "themes"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

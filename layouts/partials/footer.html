{{- $profile := site.Data.profile -}}
<footer class="site-footer">
  <div class="site-footer__inner">
    <ul class="site-footer__links">
      <li>
        <a
          class="metadata-caps"
          href="{{ $profile.links.linkedin }}"
          rel="me noopener"
          target="_blank"
        >LinkedIn</a>
      </li>
      <li>
        <a class="metadata-caps" href="mailto:{{ $profile.email }}">Email</a>
      </li>
      {{/* Guarded: no résumé link is published. See the note in data/profile.toml. */}}
      {{ with $profile.links.resume_page }}
      <li>
        <a class="metadata-caps" href="{{ . }}">Résumé</a>
      </li>
      {{ end }}
    </ul>
    <p class="site-footer__copy label-mono">
      &copy; {{ now.Year }} {{ $profile.name }}
    </p>
  </div>
</footer>

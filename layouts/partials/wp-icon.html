{{- $icons := resources.Get "work-products/icons.json" | transform.Unmarshal -}}
{{- with index $icons .name -}}<svg class="wp-ico" viewBox="0 0 24 24" width="{{ $.size | default 20 }}" height="{{ $.size | default 20 }}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ . | safeHTML }}</svg>{{- end -}}

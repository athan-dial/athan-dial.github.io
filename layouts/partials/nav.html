{{- $profile := site.Data.profile -}}
<header class="site-header">
  <div class="site-header__inner">
    <a href="/" class="site-header__name">{{ $profile.wordmark }}</a>
    <nav class="site-nav" aria-label="Primary">
      {{- $page := . -}}
      {{- range site.Menus.main }}
        {{- $active := false -}}
        {{- if hasPrefix $page.RelPermalink .URL -}}
          {{- $active = true -}}
        {{- end }}
      <a
        href="{{ .URL }}"
        class="metadata-caps"
        {{- if $active }} aria-current="page"{{- end -}}
      >{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>

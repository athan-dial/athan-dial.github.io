{{ define "main" }}
<div class="shell page-editorial">
  <div class="reading-column">
    <header class="prose prose--editorial">
      <h1>{{ .Title }}</h1>
      {{ with .Content }}{{ . }}{{ end }}
    </header>

    {{ with .Pages }}
      <ul class="grouped-fields" aria-label="Pages in {{ $.Title }}">
        {{ range .ByTitle }}
          <li>
            <span class="grouped-field__label">{{ with .Date }}{{ .Format "2006-01-02" }}{{ else }}Page{{ end }}</span>
            <div>
              <h2 class="headline-sm"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
              {{ with .Description }}<p>{{ . }}</p>{{ end }}
            </div>
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </div>
</div>
{{ end }}

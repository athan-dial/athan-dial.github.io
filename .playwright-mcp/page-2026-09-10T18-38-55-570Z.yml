          - heading "The hard choice" [level=2] [ref=f43e73]
          - paragraph [ref=f43e74]: The first hard choice was the search engine. A decision memo compared PostgreSQL with RDKit against Milvus, weighting product fit most heavily, followed by data alignment, scalability, operating ownership, and delivery risk.
          - paragraph [ref=f43e75]: PostgreSQL with RDKit won four of the five dimensions. Milvus won on the highest scale ceiling, but that was a ceiling the product had not reached. Choosing the specialized engine would have optimized for a future constraint while adding delivery and operating complexity to the first release.
          - paragraph [ref=f43e76]: The recommendation favored the proven general-purpose option, with the engine kept behind a service boundary. Milvus remained a runnable proof of concept so a real scale constraint could later justify a backend change without forcing an interface rewrite.
          - paragraph [ref=f43e77]: The second hard choice arrived after shipment. One expert saw fewer results from the internal tool than from a commercial alternative. Chasing result-count parity would have turned an external service’s behavior into the product specification.
          - paragraph [ref=f43e78]: "A different interpretation fit the evidence better: the complaint was about confidence in completeness. A looser threshold could return more candidates. More threshold choices could give the expert control. A strong-match tier and an edge-of-match tier could expose where the search became uncertain, letting the user tighten or widen it deliberately."
          - heading "Role in the case" [level=2] [ref=f43e79]
          - paragraph [ref=f43e80]: Product lead. Scope included problem framing, requirements, release phasing, user-flow definition, and the search-engine decision. The product role also held the boundary between what should become consistent in software and what the scientist should continue to judge.
          - paragraph [ref=f43e81]: Engineering owned the production implementation. Scientific users supplied the workflow knowledge and evaluated the output. The product work was to turn those inputs into a shape the team could build and revise without hiding the tradeoffs.
          - heading "What changed" [level=2] [ref=f43e82]
          - paragraph [ref=f43e83]: The tool shipped. After an implementation change, the team measured warmed-database query times for typical and heavy searches. Both improved materially, by roughly an order of magnitude.
          - paragraph [ref=f43e84]: That was a query-time result, not an end-to-end workflow result. The time from a scientist’s starting structure to a reviewed analog list was never measured, so the one-to-two-day manual baseline cannot be converted into an equally dramatic workflow claim.
          - paragraph [ref=f43e85]: At least one expert tested the running tool. Months later, the primary expert user asked for more variety and more total hits after comparing it with a commercial alternative. Universe coverage was not measured. The only recorded comparison was a single query, so it cannot support a coverage percentage.
          - paragraph [ref=f43e86]: Adoption was not instrumented either. There is no defensible user count, query count, retention measure, or evidence that the tool became the default. The measured performance change and the expert’s objection are both real. A broader adoption outcome is not in the record.
          - heading "Retrospective" [level=2] [ref=f43e87]
          - paragraph [ref=f43e88]: With hindsight, I would define adoption instrumentation as part of the first release rather than as cleanup after launch. Shipping established that the workflow could be put into software. Faster queries established that one implementation change worked. Neither answered whether experts trusted the product enough to return to it.
          - paragraph [ref=f43e89]: "I would also test the two-tier result design directly: whether experts understand why edge cases are present, and whether control over the threshold changes their sense of completeness."
          - paragraph [ref=f43e90]: The missing instrumentation is the useful finding. It is why I now treat return use and verification behavior as part of the product definition rather than evidence to look for later.

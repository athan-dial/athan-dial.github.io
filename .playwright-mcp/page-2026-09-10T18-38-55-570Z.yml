        - generic [ref=f43e41]:
          - paragraph [ref=f43e42]: An analog-search tool became materially faster after an implementation change. On a warmed database, query times for typical and heavy searches improved by roughly an order of magnitude.
          - paragraph [ref=f43e43]: Months later, its primary expert user compared the tool with a commercial alternative and saw fewer results. The apparent problem had moved from speed to completeness.
          - paragraph [ref=f43e44]: "The comparison established something real: one query returned fewer candidates. It did not establish that the internal results were less relevant, or that the commercial service defined the correct answer. The more useful product question was what an expert needed to see and control before deciding that a search was complete enough."
          - heading "Who was doing the work" [level=2] [ref=f43e45]
          - paragraph [ref=f43e46]: The search began with a compound-management scientist. A starting structure became a set of possible analogs for medicinal chemists to review, with biologists later consuming the resulting report.
          - paragraph [ref=f43e47]: This was not data entry. The scientist adjusted similarity thresholds when a result set looked too small, reconciled structures and calculated properties, checked which compounds could actually be sourced, and decided whether the resulting set made chemical sense. Judgment entered at every step.
          - paragraph [ref=f43e48]: The repeatable work around that judgment was the product opportunity.
          - heading "What was already possible" [level=2] [ref=f43e49]
          - paragraph [ref=f43e50]: The manual process worked, but it took one to two days across several disconnected tools. A scientist moved among the assay registry, a desktop chemistry tool, spreadsheets, and commercial catalogs. The manual baseline covered roughly two-thirds of the available universe.
          - paragraph [ref=f43e51]: The process also lost its reasoning. A finished spreadsheet showed which compounds survived, but not why a threshold moved or why one candidate was kept over another. The answer could be inspected. The search that produced it could not be reconstructed.
          - paragraph [ref=f43e52]: The expert was already doing the adaptive part well. The product needed to gather retrieval, ranking, availability checks, and the decision trail into one place without pretending that a fixed threshold could replace review.
          - heading "The product boundary" [level=2] [ref=f43e53]
          - paragraph [ref=f43e54]: The boundary was drawn around the repeatable parts of the work. The product would retrieve and rank candidates consistently, preserve the path to each result, and provide one place to review the set. The expert would still decide whether a molecule looked meaningfully similar and whether it was worth pursuing.
          - paragraph [ref=f43e55]: That boundary shaped the first release. The initial slice did not include every data overlay in the broader vision. It used the one dependency that was reliable enough to support a thin similarity-search workflow, which made it possible to test the central interaction without binding the product to upstream data quality the team did not control.
          - paragraph [ref=f43e56]: Make the common work reliable. Leave the last judgment legible and adjustable.
          - 'figure "The first release drew the line here deliberately: a thin similarity slice over the one dependency that was not fragile, rather than the full vision over data quality the team did not control." [ref=f43e57]':
